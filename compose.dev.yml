name: master_plan_it

# Development compose – local live-editing workflow.
# Requires the app repo at ../master_plan_it (sibling of this deploy repo).
# Do NOT use for production.

services:
  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      TZ: Europe/Rome
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -p${DB_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:6.2-alpine
    environment:
      TZ: Europe/Rome
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  frappe:
    build:
      # Context is the monorepo root so COPY master_plan_it/ works in Dockerfile.frappe.
      context: ..
      dockerfile: master-plan-it-deploy/Dockerfile.frappe
      args:
        FRAPPE_IMAGE: ${FRAPPE_IMAGE:-frappe/erpnext}
        FRAPPE_TAG: ${FRAPPE_TAG:-v16.10.1}
    image: master_plan_it-frappe:dev
    container_name: mpit-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run as root so the entrypoint can fix bind-mount permissions, then re-execs as frappe.
    user: "0:0"
    environment:
      SITE_NAME: ${SITE_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      RUN_MIGRATE_ON_START: ${RUN_MIGRATE_ON_START:-0}
      FRAPPE_REDIS_CACHE: redis://redis:6379
      FRAPPE_REDIS_QUEUE: redis://redis:6379
      FRAPPE_REDIS_SOCKETIO: redis://redis:6379
      INSTALL_APPS: ${INSTALL_APPS:-master_plan_it}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      TZ: Europe/Rome
    command: ["bash", "-lc", "/home/frappe/frappe-bench/config/entrypoint.sh"]
    volumes:
      - ./data/sites:/home/frappe/frappe-bench/sites
      - ./data/logs:/home/frappe/frappe-bench/logs
      # Live-reload: host edits are visible immediately; apply with bench migrate / clear-cache.
      - ../master_plan_it:/home/frappe/frappe-bench/apps/master_plan_it
      - ./config/entrypoint.sh:/home/frappe/frappe-bench/config/entrypoint.sh:ro
      - ./config/Procfile:/home/frappe/frappe-bench/config/Procfile:ro
    restart: unless-stopped

  frontend:
    image: master_plan_it-frappe:dev
    command: ["nginx-entrypoint.sh"]
    container_name: mpit-frontend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      BACKEND: frappe:8000
      SOCKETIO: frappe:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$$host}
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
      TZ: Europe/Rome
    depends_on:
      - frappe
    networks:
      - proxy
      - default
    ports:
      - "${HTTP_PORT:-9797}:8080"
    volumes:
      - ./data/sites:/home/frappe/frappe-bench/sites
      - ./data/logs:/home/frappe/frappe-bench/logs
    restart: unless-stopped

networks:
  proxy:
    external: true
