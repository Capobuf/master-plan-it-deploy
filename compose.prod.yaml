name: mpit

services:
  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - frappe
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 5
      start_period: 30s
    env_file:
      - prod.env 

  redis:
    image: redis:6.2-alpine
    volumes:
      - redis-data:/data
    networks:
      - frappe
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    env_file:
      - prod.env 

  backend:
    build:
      context: ..
      dockerfile: master-plan-it-deploy/Dockerfile.frappe
      args:
        FRAPPE_TAG: ${FRAPPE_TAG:-v16.10.1}
    image: mpit-frappe:${FRAPPE_TAG:-v16.10.1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis://redis:6379
      REDIS_QUEUE: redis://redis:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./config/prod-entrypoint.sh:/entrypoint.sh:ro
      - ./config/prod.Procfile:/home/frappe/frappe-bench/Procfile:ro
    networks:
      - frappe
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    env_file:
      - prod.env 

  frontend:
    image: mpit-frappe:${FRAPPE_TAG:-v16.10.1}
    depends_on:
      - backend
    environment:
      BACKEND: backend:8000
      SOCKETIO: backend:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$$host}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-9797}:8080"
    networks:
      frappe: {}
      proxy:
        aliases:
          - mpit-frontend
    restart: unless-stopped
    command: ["nginx-entrypoint.sh"]
    env_file:
      - prod.env 

volumes:
  db-data:
  redis-data:
  sites:
  logs:

networks:
  frappe:
  proxy:
    external: true
