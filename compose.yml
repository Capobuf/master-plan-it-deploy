name: master_plan_it

# Minimal Frappe Framework v16 development stack for Master Plan IT.
# This compose file is development-only: setup creates a bench, runtime uses bench start.

services:
  db:
    image: mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT:-./data}/db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - default

  redis:
    image: redis:7-alpine
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - default

  setup:
    image: ${FRAPPE_IMAGE}:${FRAPPE_TAG}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    user: "0:0"
    environment:
      SITE_NAME: ${SITE_NAME}
      FRAPPE_PASSWORD: ${FRAPPE_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      ALLOW_TESTS: ${ALLOW_TESTS:-1}
      CYPRESS_FRAPPE_USER: ${CYPRESS_FRAPPE_USER:-cypress@example.local}
      CYPRESS_FRAPPE_PASSWORD: ${CYPRESS_FRAPPE_PASSWORD:-mpit_cypress_test}
      DEVELOPER_MODE: ${DEVELOPER_MODE:-0}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - ${DATA_ROOT:-./data}/bench:/home/frappe/frappe-bench
      - ${DATA_ROOT:-./data}/sites:/home/frappe/frappe-bench/sites
      - ${DATA_ROOT:-./data}/logs:/home/frappe/frappe-bench/logs
      - ${APP_PATH}:/workspace/master_plan_it
      - ./scripts/setup-site.sh:/workspace/scripts/setup-site.sh:ro
    working_dir: /home/frappe
    command:
      - bash
      - -lc
      - |
        install -d -o frappe -g frappe /home/frappe/frappe-bench
        chown -R frappe:frappe /home/frappe/frappe-bench
        exec su -s /bin/bash frappe -c /workspace/scripts/setup-site.sh
    restart: "no"
    networks:
      - default
    
  frappe:
    image: ${FRAPPE_IMAGE}:${FRAPPE_TAG}
    depends_on:
      setup:
        condition: service_completed_successfully
    container_name: frappe
    environment:
      SITE_NAME: ${SITE_NAME}
      FRAPPE_PASSWORD: ${FRAPPE_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT:-./data}/bench:/home/frappe/frappe-bench
      - ${DATA_ROOT:-./data}/sites:/home/frappe/frappe-bench/sites
      - ${DATA_ROOT:-./data}/logs:/home/frappe/frappe-bench/logs
      - ${APP_PATH}:/workspace/master_plan_it
    working_dir: /home/frappe/frappe-bench
    command: ["bench", "start", "--no-dev"]
    ports:
      - "${HTTP_PORT}:8000"
    restart: unless-stopped
    networks:
      - default
      - proxy

  cypress:
    image: cypress/included:13.17.0
    profiles: ["test"]
    depends_on:
      frappe:
        condition: service_started
    environment:
      CYPRESS_BASE_URL: ${CYPRESS_BASE_URL}
      CYPRESS_FRAPPE_USER: ${CYPRESS_FRAPPE_USER:-cypress@example.local}
      CYPRESS_FRAPPE_PASSWORD: ${CYPRESS_FRAPPE_PASSWORD:-mpit_cypress_test}
      TZ: ${TZ}
    volumes:
      - ${APP_PATH}/cypress:/e2e:ro
    working_dir: /e2e
    command: ["--browser", "chrome", "--headless"]
    networks:
      - default

networks:
  proxy:
    external: true
