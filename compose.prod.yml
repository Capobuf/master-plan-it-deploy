name: mpit

# Production compose – uses a pre-built image; no build, no app source mounts.
# Upgrade path: pull new image → up --force-recreate → bench migrate → verify.

services:
  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - frappe
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -p${DB_ROOT_PASSWORD} --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:6.2-alpine
    volumes:
      - redis-data:/data
    networks:
      - frappe
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    image: ${CUSTOM_IMAGE}:${CUSTOM_TAG}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      REDIS_CACHE: redis://redis:6379
      REDIS_QUEUE: redis://redis:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - frappe
    restart: unless-stopped
    # /entrypoint.sh is baked into the image by Dockerfile.frappe
    entrypoint: ["/entrypoint.sh"]

  frontend:
    image: ${CUSTOM_IMAGE}:${CUSTOM_TAG}
    depends_on:
      - backend
    environment:
      BACKEND: backend:8000
      SOCKETIO: backend:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$$host}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-9797}:8080"
    networks:
      frappe: {}
      proxy:
        aliases:
          - mpit-frontend
    restart: unless-stopped
    command: ["nginx-entrypoint.sh"]

volumes:
  db-data:
  redis-data:
  sites:
  logs:

networks:
  frappe:
  proxy:
    external: true
